name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

      # 서버 단위 테스트(*Test) — build.gradle 에서 통합(*IT)은 제외되어 실 DB 없이 CI 에서 실행 가능.
      # test 태스크가 compileJava·compileTestJava 를 선행하므로 컴파일 검증도 함께 커버한다.
      - name: Server unit tests
        working-directory: server
        run: ./gradlew check --no-daemon
      - name: Java and TypeScript chart transform parity
        run: npm run test:parity

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run gen:defaults

      - name: Start PostgreSQL and PostGIS integration databases
        run: docker compose --profile spatial-test up -d --wait postgres postgis-test

      - name: Server real-database integration tests
        working-directory: server
        run: ./gradlew verifyFlywayResources integrationTest --no-daemon
        env:
          CHARTSDK_REQUIRE_ROLE_IT: "true"

      - name: Database logs
        if: failure()
        run: docker compose --profile spatial-test logs --no-color postgres postgis-test

      - name: Stop integration databases
        if: always()
        run: docker compose --profile spatial-test down -v

  real-backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run gen:defaults
      - run: npx playwright install --with-deps chromium

      - name: Admin to Spring/PostGIS real-backend E2E
        run: npm run test:e2e:real

      - name: Upload real E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-backend-e2e-diagnostics
          path: |
            admin/test-results/real-e2e/
            admin/playwright-report/
          if-no-files-found: ignore

      - name: Remove real E2E database
        if: always()
        run: docker compose --profile real-e2e rm -s -f e2e-db
