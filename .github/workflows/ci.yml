name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

      # 서버 단위 테스트(*Test) — build.gradle 에서 통합(*IT)은 제외되어 실 DB 없이 CI 에서 실행 가능.
      # test 태스크가 compileJava·compileTestJava 를 선행하므로 컴파일 검증도 함께 커버한다.
      - name: Server unit tests
        working-directory: server
        run: ./gradlew test --no-daemon
