services:
  postgres:
    image: postgres:17
    container_name: chartsol-postgres
    environment:
      POSTGRES_DB: chartsol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0218"
    ports:
      - "5433:5432"
    volumes:
      - chartsol_pgdata:/var/lib/postgresql/data
      - ./docs/V1__init.sql:/docker-entrypoint-initdb.d/01-chartsol-schema.sql:ro
      - ./docker/postgres/init/02-chartsol-user.sql:/docker-entrypoint-initdb.d/02-chartsol-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chartsol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chartsol_pgdata:
