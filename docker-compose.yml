services:
  postgres:
    image: postgres:17
    container_name: chartsol-postgres
    environment:
      POSTGRES_DB: chartsol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0218"
    ports:
      - "5433:5432"
    volumes:
      - chartsol_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init/00-runtime-roles.sql:/docker-entrypoint-initdb.d/00-runtime-roles.sql:ro
      - ./docs/V1__init.sql:/docker-entrypoint-initdb.d/01-chartsol-schema.sql:ro
      - ./docker/postgres/init/02-chartsol-user.sql:/docker-entrypoint-initdb.d/02-chartsol-user.sql:ro
      - ./docker/postgres/init/03-runtime-grants.sql:/docker-entrypoint-initdb.d/03-runtime-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chartsol"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 공간 차트 데모 + PostGIS 통합 테스트 전용. 기존 chartsol-postgres와 데이터·포트를 공유하지 않는다.
  # 실행: docker compose --profile spatial-test up -d postgis-test
  postgis-test:
    image: postgis/postgis:17-3.5
    container_name: chartsdk-postgis-test
    profiles: ["spatial-test"]
    environment:
      POSTGRES_DB: chartsdk_spatial_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0218"
    ports:
      - "55433:5432"
    volumes:
      - chartsdk_postgis_data:/var/lib/postgresql/data
      - ./docker/postgis/init/01-geometry-chart-data.sql:/docker-entrypoint-initdb.d/01-geometry-chart-data.sql:ro
      - ./docker/postgis/init/02-korea-map-data.sql:/docker-entrypoint-initdb.d/02-korea-map-data.sql:ro
      - ./docker/postgis/init/03-korea-statistics-years.sql:/docker-entrypoint-initdb.d/03-korea-statistics-years.sql:ro
      - ./docker/postgis/init/04-source-reader.sql:/docker-entrypoint-initdb.d/04-source-reader.sql:ro
      - ./chart-options/maps/kr-sigungu.json:/docker-entrypoint-initdb.d/kr-sigungu.json:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chartsdk_spatial_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Admin → Spring → PostgreSQL/PostGIS → SDK 임베드까지 관통하는 브라우저 E2E 전용.
  # 기존 개발 DB와 포트·데이터 디렉터리를 공유하지 않고 매 실행마다 tmpfs에서 새로 만든다.
  e2e-db:
    image: postgis/postgis:17-3.5
    container_name: chartsdk-real-e2e-db
    profiles: ["real-e2e"]
    environment:
      POSTGRES_DB: chartsdk_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "chartsdk-e2e"
    ports:
      - "56432:5432"
    volumes:
      - ./docker/e2e/init/00-runtime-role.sql:/docker-entrypoint-initdb.d/00-runtime-role.sql:ro
      - ./docs/V1__init.sql:/docker-entrypoint-initdb.d/01-meta-schema.sql:ro
      - ./docker/e2e/init/02-spatial-chart-data.sql:/docker-entrypoint-initdb.d/02-spatial-chart-data.sql:ro
      - ./docker/e2e/init/03-runtime-grants.sql:/docker-entrypoint-initdb.d/03-runtime-grants.sql:ro
      - ./chart-options/maps/kr-sigungu.json:/docker-entrypoint-initdb.d/kr-sigungu.json:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chartsdk_e2e"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  chartsol_pgdata:
  chartsdk_postgis_data:
