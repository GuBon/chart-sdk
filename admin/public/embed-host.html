<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChartSDK 수동 임베드 호스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f6f8;
      color: #171717;
      font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    /* 차트 슬롯은 이 수동 호스트가 정한 크기로 표시한다. */
    main { margin: 40px; }
    .guide {
      margin-bottom: 20px;
      padding: 18px 20px;
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      background: #fff;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; color: #5f6875; }
    code { color: #364152; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .embed-area {
      width: max-content;
      min-width: 100%;
      overflow: visible;
      border: 1px dashed #b8c0cc;
      border-radius: 12px;
      background: #fff;
    }

    /*
     * [선택 사항 1] 아래 기본 640x360 대신 원하는 고정 크기를 쓰려면 아래 주석을
     * 해제하고 width와 height를 수정한다. JavaScript가 지정한 인라인 크기보다
     * 우선하도록 이 선택 규칙에만 !important를 사용한다.
     *
     * [data-embed-key] {
     *   width: 1280px !important;
     *   height: 720px !important;
     * }
     */

    /*
     * [선택 사항 2] 화면 폭에 맞춰 반응형으로 축소하려면 아래 주석을 해제한다.
     * aspect-ratio는 원래 16:9 비율을 유지하고 height:auto가 높이를 계산한다.
     *
     * .embed-area {
     *   width: 100%;
     * }
     * [data-embed-key] {
     *   width: 100% !important;
     *   height: auto !important;
     *   aspect-ratio: 16 / 9;
     * }
     */
  </style>
</head>
<body>
  <main>
    <section class="guide">
      <h1>수동 임베드 확인 페이지</h1>
      <p>Admin의 임베드 코드 모달에서 복사한 HTML을 아래 표시 위치에 직접 붙여 넣고 저장한 뒤 브라우저를 새로고침하세요.</p>
      <p>이 페이지는 차트 정의의 논리 설계 크기를 조회하지 않고 슬롯에 640x360을 적용합니다. 다른 고정 크기나 반응형 크기는 위 CSS의 ‘선택 사항’을 사용하세요.</p>
    </section>

    <section class="embed-area">
      <!-- 임베드 코드 붙여넣기 시작 -->
      <!-- Admin 임베드 모달에서 복사한 <div> + <script>를 여기에 붙여 넣으세요. -->
      <!-- 임베드 코드 붙여넣기 끝 -->
    </section>
  </main>

  <script>
    /*
     * 임베드 코드에는 chartId 가 없다(불투명 임베드 키만) — 이 수동 확인 페이지도 차트 정의를
     * 따로 조회할 수 없으므로, 크기가 지정되지 않은 슬롯에는 표준 크기(640x360)를 적용한 뒤
     * SDK 를 로드한다. 다른 크기가 필요하면 위 CSS '선택 사항' 주석이나 인라인 스타일을 사용한다.
     *
     * 운영용 임베드 코드의 SDK/API 주소가 바뀌면 아래 두 값만 변경한다.
     */
    const CHARTSDK_SRC = 'http://localhost:3000/sdk.js';
    const CHARTSDK_API_BASE = 'http://localhost:8080';

    function applyDefaultChartSizes() {
      document.querySelectorAll('[data-embed-key]').forEach((element) => {
        element.style.width ||= '640px';
        element.style.height ||= '360px';
      });
    }

    function loadChartSdk() {
      const script = document.createElement('script');
      script.src = CHARTSDK_SRC;
      script.dataset.apiBase = CHARTSDK_API_BASE;
      document.body.appendChild(script);
    }

    applyDefaultChartSizes();
    loadChartSdk();
  </script>
</body>
</html>
